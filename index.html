<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>For Aashiya ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 20% 20%, #ffd6e7 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #ffc6dc 0%, transparent 30%),
        linear-gradient(135deg,#fff0f5,#ffd9e6,#ffeaf1);
    position:relative;
}

/* soft moving background */
body::before{
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    border-radius:50%;
    background:rgba(255,255,255,0.28);
    filter:blur(50px);
    animation:moveGlow 8s infinite alternate ease-in-out;
}

@keyframes moveGlow{
    from{
        transform:translate(-180px,-100px) scale(1);
    }
    to{
        transform:translate(180px,120px) scale(1.3);
    }
}

/* floating hearts */
.bg-heart{
    position:absolute;
    bottom:-50px;
    pointer-events:none;
    animation:floatUp linear forwards;
    opacity:.75;
}

@keyframes floatUp{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }
    15%{
        opacity:.8;
    }
    100%{
        transform:translateY(-115vh) rotate(360deg);
        opacity:0;
    }
}

/* main card */
.card{
    width:min(90%,700px);
    min-height:430px;
    padding:45px 35px;
    position:relative;
    z-index:5;

    background:rgba(255,255,255,.48);
    border:1px solid rgba(255,255,255,.75);
    border-radius:35px;

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    box-shadow:
        0 25px 80px rgba(190,70,110,.20),
        inset 0 1px 0 rgba(255,255,255,.8);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;

    animation:cardIn .8s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:scale(.85) translateY(30px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.title{
    color:#c23d72;
    font-size:clamp(32px,7vw,58px);
    font-weight:800;
    margin-bottom:35px;
    text-shadow:0 5px 20px rgba(194,61,114,.18);
}

.question{
    color:#7e244d;
    font-size:clamp(21px,4vw,32px);
    font-weight:700;
    line-height:1.5;
    max-width:600px;
    min-height:110px;

    display:flex;
    justify-content:center;
    align-items:center;

    animation:questionIn .45s ease;
}

@keyframes questionIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.buttons{
    margin-top:35px;
    display:flex;
    gap:25px;
    justify-content:center;
    align-items:center;
    position:relative;
    min-height:70px;
    width:100%;
}

button{
    border:none;
    outline:none;
    cursor:pointer;

    min-width:145px;
    padding:17px 28px;

    border-radius:50px;
    font-size:20px;
    font-weight:700;

    transition:
        transform .2s ease,
        box-shadow .2s ease;

    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
}

button:active{
    transform:scale(.92);
}

.yes{
    color:#b52f66;
    background:linear-gradient(135deg,#fff,#ffe7f0);
    box-shadow:
        0 10px 30px rgba(255,80,140,.25),
        inset 0 0 15px rgba(255,255,255,.8);
}

.no{
    color:white;
    background:linear-gradient(135deg,#ef5c91,#d93470);
    box-shadow:0 10px 30px rgba(210,45,100,.25);

    position:relative;
    z-index:20;
}

.start-btn{
    margin-top:20px;
}

/* final */
.final-title{
    font-size:clamp(38px,8vw,65px);
    color:#d52e70;
    animation:happy 1s infinite alternate;
}

@keyframes happy{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.08);
    }
}

.shayari{
    margin-top:25px;
    color:#7b2349;
    font-size:clamp(18px,4vw,25px);
    line-height:1.8;
    font-weight:600;
}

.signature{
    margin-top:28px;
    color:#c52d69;
    font-size:25px;
    font-weight:800;
}

/* heart particles */
.particle{
    position:fixed;
    pointer-events:none;
    z-index:100;
    font-size:25px;
    animation:burst 1.2s ease-out forwards;
}

@keyframes burst{
    0%{
        transform:translate(0,0) scale(.3);
        opacity:1;
    }
    100%{
        transform:
            translate(
                calc((var(--x) - .5) * 500px),
                calc((var(--y) - .5) * 500px)
            )
            scale(1.4);
        opacity:0;
    }
}

/* rain */
.rain-heart{
    position:fixed;
    top:-50px;
    z-index:90;
    pointer-events:none;
    animation:rain linear forwards;
}

@keyframes rain{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

/* sad flash */
.sad{
    animation:sadScreen .45s ease;
}

@keyframes sadScreen{
    0%,100%{
        filter:none;
    }
    50%{
        filter:grayscale(.7) brightness(.8);
    }
}

/* mobile */
@media(max-width:600px){

    .card{
        width:92%;
        min-height:430px;
        padding:35px 20px;
        border-radius:28px;
    }

    .buttons{
        gap:12px;
    }

    button{
        min-width:125px;
        padding:15px 20px;
        font-size:18px;
    }

    .question{
        min-height:140px;
    }
}
</style>
</head>

<body>

<div id="background"></div>

<div class="card" id="card">

    <div class="title" id="title">
        Hey Aashiya 🌸
    </div>

    <div class="question" id="question">
        Oye Aashiya, chalo ek game khelte hain na? 🥰🌸
    </div>

    <div class="buttons" id="buttons">

        <button class="yes start-btn" id="start">
            Start ❤️
        </button>

    </div>

</div>

<script>

/* =========================
   QUESTIONS
========================= */

const questions = [

"ashiya chalo na sb bhul jate hai aur ek new fresh start karte hai? 😊",

"achha ashiya, tumhe nhi lagta ki tumhe vitamin asrar ki kami h? 😜",

"aap ko ni lagta ki hume mila chahhiye? 🌸",

"suchhi yaar ise bahane humara date bhi ho jayega? 😅",

"ok tell me kharush larki, kya mai tumhara special person hu na ?🤭🤭",

"oye bachhu ashiya, do you love me na ? ✨",

"oye bachhu, kya mai tumhare liye best hu? 🌿",

"kharush beharam ashiya, do you miss me na jitna mai miss karta? 👀",

"ashiya, chalo chup chap promise karo harmesha sath rahogi aur kabhi bhi chor ke nhi jaogi chahe kitni bhi bada problem aaye? 🌙",

"kharush larli last question, hamesha mera rahna? 😊",

"Aur ha ye pakka wala last question hai waise hum dono sath me acche lagte h na ??",

"Ye last h promise 😁 waise humari jodi bhi best lagegi i swear🥰🤭"

];


/* =========================
   ELEMENTS
========================= */

const card = document.getElementById("card");
const title = document.getElementById("title");
const question = document.getElementById("question");
const buttons = document.getElementById("buttons");
const start = document.getElementById("start");


let current = 0;


/* =========================
   BACKGROUND HEARTS
========================= */

function createBackgroundHeart(){

    const heart = document.createElement("div");

    heart.className = "bg-heart";

    const emojis = [
        "❤️","💗","💕","💖","💓","✨","🌸"
    ];

    heart.innerText =
        emojis[Math.floor(Math.random()*emojis.length)];

    heart.style.left =
        Math.random()*100 + "vw";

    heart.style.fontSize =
        (18 + Math.random()*25) + "px";

    heart.style.animationDuration =
        (6 + Math.random()*7) + "s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },14000);
}

setInterval(createBackgroundHeart,700);


/* =========================
   SOUND
========================= */

let audioContext;

function sound(type){

    try{

        if(!audioContext){
            audioContext =
                new (window.AudioContext ||
                window.webkitAudioContext)();
        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        if(type === "yes"){

            oscillator.frequency.setValueAtTime(
                520,
                audioContext.currentTime
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                900,
                audioContext.currentTime + .15
            );

        }else{

            oscillator.frequency.setValueAtTime(
                260,
                audioContext.currentTime
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                120,
                audioContext.currentTime + .25
            );
        }

        gain.gain.setValueAtTime(
            .08,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime + .3
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + .3
        );

    }catch(e){}
}


/* =========================
   START GAME
========================= */

start.addEventListener("click",function(){

    sound("yes");

    current = 0;

    showQuestion();

});


/* =========================
   SHOW QUESTION
========================= */

function showQuestion(){

    question.style.animation="none";

    void question.offsetWidth;

    question.style.animation=
        "questionIn .45s ease";

    question.innerText =
        questions[current];

    buttons.innerHTML="";

    const yes =
        document.createElement("button");

    yes.className="yes";

    yes.innerText="Yes 😊❤️";


    const no =
        document.createElement("button");

    no.className="no";

    no.innerText="No 😭";


    buttons.appendChild(yes);
    buttons.appendChild(no);


    /* YES */

    yes.addEventListener("click",function(){

        sound("yes");

        heartBurst();

        heartRain();

        setTimeout(()=>{

            current++;

            if(current < questions.length){

                showQuestion();

            }else{

                showFinal();

            }

        },650);

    });


    /* NO */

    no.addEventListener("click",function(e){

        sound("no");

        sadEffect();

        moveNoButton(no);

    });


    /* mobile touch support */

    no.addEventListener("touchstart",function(e){

        e.preventDefault();

        sound("no");

        sadEffect();

        moveNoButton(no);

    },{passive:false});

}


/* =========================
   NO BUTTON RUN AWAY
========================= */

function moveNoButton(button){

    const padding=15;

    const maxX =
        window.innerWidth -
        button.offsetWidth -
        padding;

    const maxY =
        window.innerHeight -
        button.offsetHeight -
        padding;

    const x =
        Math.max(
            padding,
            Math.random()*maxX
        );

    const y =
        Math.max(
            padding,
            Math.random()*maxY
        );


    button.style.position="fixed";

    button.style.left=x+"px";
    button.style.top=y+"px";

    button.style.transition=
        "left .35s ease, top .35s ease, transform .25s ease";

    button.style.transform=
        "rotate("+(Math.random()*30-15)+"deg) scale(1.05)";
}


/* =========================
   SAD EFFECT
========================= */

function sadEffect(){

    document.body.classList.add("sad");

    setTimeout(()=>{
        document.body.classList.remove("sad");
    },450);

    const sad =
        document.createElement("div");

    sad.innerText="🥺💔";

    sad.style.position="fixed";
    sad.style.left="50%";
    sad.style.top="50%";
    sad.style.transform="translate(-50%,-50%)";
    sad.style.fontSize="55px";
    sad.style.zIndex="200";
    sad.style.pointerEvents="none";

    document.body.appendChild(sad);

    setTimeout(()=>{
        sad.remove();
    },700);
}


/* =========================
   HEART BURST
========================= */

function heartBurst(){

    const emojis=[
        "❤️","💗","💕","💖","💓","💘","✨"
    ];

    for(let i=0;i<30;i++){

        const p =
            document.createElement("div");

        p.className="particle";

        p.innerText =
            emojis[
                Math.floor(
                    Math.random()*emojis.length
                )
            ];

        p.style.left="50%";
        p.style.top="50%";

        p.style.setProperty(
            "--x",
            Math.random()
        );

        p.style.setProperty(
            "--y",
            Math.random()
        );

        document.body.appendChild(p);

        setTimeout(()=>{
            p.remove();
        },1300);
    }
}


/* =========================
   HEART RAIN
========================= */

function heartRain(){

    const emojis=[
        "❤️","💗","💕","💖","💓","💘","✨"
    ];

    for(let i=0;i<45;i++){

        const heart =
            document.createElement("div");

        heart.className="rain-heart";

        heart.innerText =
            emojis[
                Math.floor(
                    Math.random()*emojis.length
                )
            ];

        heart.style.left =
            Math.random()*100+"vw";

        heart.style.fontSize =
            (18+Math.random()*28)+"px";

        heart.style.animationDuration =
            (1.5+Math.random()*2)+"s";

        heart.style.animationDelay =
            Math.random()*.5+"s";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },4000);
    }
}


/* =========================
   FINAL SCREEN
========================= */

function showFinal(){

    heartRain();
    heartRain();

    title.className="final-title";

    title.innerHTML=
        "Happyyyyyy 🥰❤️";

    question.innerHTML=
        `
        💗 💖 💕 ✨<br><br>

        “Dil se jo chaha tha, woh aaj mil gaya,<br>
        tere haan kehne se mera jahaan khil gaya. ❤️”
        `;

    question.className="shayari";

    buttons.innerHTML="";

    const signature =
        document.createElement("div");

    signature.className="signature";

    signature.innerHTML=
        "Tumhara Asrar ❤️";

    buttons.appendChild(signature);

}


/* =========================
   PREVENT DOUBLE TAP ZOOM
========================= */

document.addEventListener(
    "dblclick",
    function(e){
        e.preventDefault();
    },
    {passive:false}
);

</script>

</body>
</html>
